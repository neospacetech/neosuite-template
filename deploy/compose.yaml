# Compose fragment merged by neosuite-dist. Paths are relative to this file.
services:
  neoexample-backend:
    image: ghcr.io/neospacetech/neoexample-backend:${NEOEXAMPLE_VERSION:-dev}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      NEOEXAMPLE_ENVIRONMENT: production
      NEOEXAMPLE_LOG_LEVEL: info
    expose:
      - "8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
