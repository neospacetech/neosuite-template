[package]
name = "neoexample-py"
description = "Python bindings for neoexample-core, built by maturin into the neoexample_core wheel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "neoexample_py"
crate-type = ["cdylib"]
# The extension module links against the host interpreter at import time,
# so it has no standalone test binary. Logic is tested in `neoexample-core`
# and the bindings are exercised by the backend test suite.
test = false
doctest = false

[dependencies]
neoexample-core.workspace = true
pyo3 = { workspace = true, features = ["extension-module"] }
