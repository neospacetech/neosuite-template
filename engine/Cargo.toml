[workspace]
members = ["core", "py"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
repository = "https://github.com/neospacetech/neosuite-template"

[workspace.dependencies]
neoexample-core = { path = "core" }
pyo3 = { version = "0.29", features = ["abi3-py312"] }

[profile.release]
lto = "thin"
codegen-units = 1
